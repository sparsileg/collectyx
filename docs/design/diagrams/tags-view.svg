  <text x="92" y="78" font-size="12" fill="#000000">Count</text>
  <text x="206" y="78" font-size="11" fill="#000000">&#9662;</text>

  <line x1="30" y1="98" x2="570" y2="98" stroke="#e2e8f0"/>

  <g>
    <text x="30" y="126" font-size="13" fill="#000000">sci-fi</text>
    <text x="90" y="126" font-size="11" fill="#666666">24 books</text>
    <rect x="420" y="112" width="70" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
