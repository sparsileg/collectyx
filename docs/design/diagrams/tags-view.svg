  <text x="56" y="282" font-size="11" fill="#888888">Choose a tag&#8230;</text>
  <rect x="470" y="266" width="80" height="24" rx="5" fill="#dc2626"/>
  <text x="510" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Delete</text>
