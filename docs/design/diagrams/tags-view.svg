    <rect x="498" y="112" width="70" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="533" y="128" text-anchor="middle" font-size="11" fill="#000000">Delete</text>
    <line x1="30" y1="146" x2="570" y2="146" stroke="#f1f5f9"/>
  </g>

  <g>
    <text x="30" y="174" font-size="13" fill="#000000">favorites</text>
    <text x="100" y="174" font-size="11" fill="#666666">19 books</text>
    <rect x="420" y="160" width="70" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="455" y="176" text-anchor="middle" font-size="11" fill="#000000">Rename</text>
    <rect x="498" y="160" width="70" height="24" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="533" y="176" text-anchor="middle" font-size="11" fill="#000000">Delete</text>
    <line x1="30" y1="194" x2="570" y2="194" stroke="#f1f5f9"/>
  </g>

  <rect x="30" y="216" width="540" height="76" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="46" y="238" font-size="12" font-weight="bold" fill="#000000">Delete &#8220;memoir&#8221;?</text>
  <text x="46" y="258" font-size="11" fill="#333333">9 books use this tag. Optionally substitute another tag before removing it:</text>
