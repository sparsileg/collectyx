<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="580" height="360" rx="10" fill="#ffffff" stroke="#94a3b8"/>

  <text x="30" y="46" font-size="18" font-weight="bold" fill="#000000">Tags</text>
