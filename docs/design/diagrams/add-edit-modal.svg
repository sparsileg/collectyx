<svg width="600" height="520" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="600" height="520" fill="#f1f5f9"/>
  <rect x="90" y="30" width="420" height="460" rx="12" fill="#ffffff" stroke="#94a3b8"/>

  <text x="114" y="66" font-size="16" font-weight="bold" fill="#000000">Add book</text>
  <line x1="114" y1="80" x2="486" y2="80" stroke="#e2e8f0"/>

  <text x="114" y="106" font-size="11" fill="#555555">Title</text>
  <rect x="114" y="112" width="372" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>

  <text x="114" y="160" font-size="11" fill="#555555">Given name(s)</text>
  <rect x="114" y="166" width="180" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="306" y="160" font-size="11" fill="#555555">Surname</text>
  <rect x="306" y="166" width="180" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>

  <text x="114" y="214" font-size="11" fill="#555555">Second author (optional)</text>
  <rect x="114" y="220" width="180" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="306" y="220" width="180" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>

  <text x="114" y="268" font-size="11" fill="#555555">Tags</text>
  <rect x="114" y="274" width="372" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="122" y="294" font-size="11" fill="#888888">Type a tag and press Enter&#8230;</text>
  <rect x="114" y="308" width="60" height="20" rx="10" fill="#dbeafe"/>
  <text x="144" y="322" text-anchor="middle" font-size="10" fill="#000000">sci-fi</text>

  <line x1="114" y1="342" x2="486" y2="342" stroke="#e2e8f0"/>
  <text x="114" y="362" font-size="11" font-weight="bold" fill="#000000">Read details</text>

  <text x="114" y="384" font-size="11" fill="#555555">Finished</text>
  <rect x="114" y="390" width="170" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="300" y="384" font-size="11" fill="#555555">Rating (1&#8211;10)</text>
  <rect x="300" y="390" width="186" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>

  <rect x="306" y="440" width="90" height="34" rx="6" fill="#1d4ed8"/>
  <text x="351" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Save</text>
  <rect x="404" y="440" width="82" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="445" y="462" text-anchor="middle" font-size="13" fill="#000000">Cancel</text>
</svg>
