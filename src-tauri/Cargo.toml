[package]
name = "collectyx"
# Keep in sync with src/js/constants.js's CONSTANTS.APP_VERSION.
version = "1.0.0-rc.1"
description = "Collectyx — Media tracking and management"
authors = ["Sparsile"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "collectyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite    = { version = "0.32", features = ["bundled"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
dirs-next   = "2"
log         = "0.4"
uuid        = { version = "1", features = ["v4"] }
tauri                = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-dialog  = "2"
tauri-plugin-log     = "2"
tauri-plugin-single-instance = "2"

[features]
default = []
# Gates set_app_meta (current_owner switch, #59 / CTX-SEC-109). Off by
# default so a shipped build cannot switch owners via IPC at all. Must be
# combined with ENABLE_OWNER_TEST_SWITCH: true in src/js/constants.js —
# that flag alone only hides the UI button, it does not gate the command.
owner-test-switch = []
