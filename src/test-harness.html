<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectyx — Test Harness</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/collection-view.css">
    <link rel="stylesheet" href="css/modal-fields.css">
    <link rel="stylesheet" href="css/themes/nordic.css" id="themeLink">

    <style>
        /* Harness-only chrome — not part of the app, never ships */
        .harness-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 12px 20px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85em;
        }
        .harness-bar strong { margin-right: 6px; }
        .harness-tabs {
            display: flex;
            gap: 8px;
            padding: 16px 20px 0;
        }
        .harness-tab {
            padding: 8px 16px;
            border-radius: var(--border-radius-sm) var(--border-radius-sm) 0 0;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .harness-tab.active {
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 500;
        }
        .harness-page {
            padding: 20px;
        }
        .collection-panel { display: none; }
        .collection-panel.active { display: block; }
    </style>
  </head>
  <body>

    <div class="harness-bar">
        <span><strong>Theme:</strong>
            <select id="harnessThemeSelect" onchange="harnessChangeTheme(this.value)">
                <option value="css/themes/nordic.css">Nordic</option>
                <option value="css/themes/dark.css">Dark</option>
                <option value="css/themes/light.css">Light</option>
                <option value="css/themes/matrix.css">Matrix</option>
                <option value="css/themes/flat.css">Flat</option>
            </select>
        </span>
        <span><strong>Date format:</strong>
            <select id="harnessDateFormatSelect" onchange="harnessChangeDateFormat(this.value)">
                <option value="MM-DD-YYYY">MM-DD-YYYY</option>
                <option value="DD-MM-YYYY">DD-MM-YYYY</option>
                <option value="YYYY-MM-DD">YYYY-MM-DD</option>
            </select>
        </span>
        <span style="margin-left: auto; color: var(--text-secondary);">Test harness — synthetic data only, not connected to DBManager</span>
    </div>

    <div class="harness-tabs">
        <div class="harness-tab active" data-panel="panel-consumed" onclick="harnessShowPanel('panel-consumed', this)">Books Read</div>
        <div class="harness-tab" data-panel="panel-queued" onclick="harnessShowPanel('panel-queued', this)">To Be Read</div>
        <div class="harness-tab" data-panel="panel-owned" onclick="harnessShowPanel('panel-owned', this)">My Library</div>
    </div>

    <div class="harness-page">
        <div id="panel-consumed" class="collection-panel active"></div>
        <div id="panel-queued" class="collection-panel"></div>
        <div id="panel-owned" class="collection-panel"></div>
    </div>

    <!-- ── Books Read modal ─────────────────────────────────────────────── -->
    <div id="cbrModal" class="modal">
      <div class="modal-content modal-content-wide">
        <h3 id="cbrModalTitle">Add</h3>
        <form id="cbrForm" onsubmit="ConsumedModal.save(event)">
          <div class="form-group">
            <label for="cbrFinished">Finished:</label>
            <input type="text" id="cbrFinished" maxlength="10">
          </div>
          <div class="form-group">
            <label for="cbrTitle">Title:</label>
            <input type="text" id="cbrTitle" required>
          </div>

          <div class="form-group-heading">Author</div>
          <div class="author-row">
            <input type="text" id="cbrAuthorGiven" placeholder="Given Name(s)">
            <input type="text" id="cbrAuthorSurname" placeholder="Surname">
          </div>

          <div class="form-group-heading">Author 2</div>
          <div class="author-row">
            <input type="text" id="cbrAuthor2Given" placeholder="Given Name(s)">
            <input type="text" id="cbrAuthor2Surname" placeholder="Surname">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cbrPages">Pages:</label>
              <input type="number" id="cbrPages" min="1">
            </div>
            <div class="form-group">
              <label for="cbrISBN">ISBN:</label>
              <input type="text" id="cbrISBN">
            </div>
          </div>

          <div class="form-group">
            <label for="cbrRating">Rating:</label>
            <select id="cbrRating"></select>
          </div>

          <div class="form-group">
            <label for="cbrTagsInput">Tags:</label>
            <div class="tag-chip-container">
              <div class="tag-chip-field">
                <input type="text" id="cbrTagsInput" placeholder="Type a tag and press Enter" autocomplete="off">
                <div class="tag-chip-suggestions" id="cbrTagsSuggestions"></div>
              </div>
              <div class="tag-chip-row" id="cbrTagsChipRow"></div>
              <input type="hidden" id="cbrTags">
            </div>
          </div>

          <div class="form-group">
            <label for="cbrComments">Comments:</label>
            <textarea id="cbrComments" placeholder="Optional notes"></textarea>
          </div>

          <div class="modal-actions">
            <div class="modal-actions-left">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-secondary" onclick="ConsumedModal.close()">Cancel</button>
            </div>
            <button type="button" id="cbrDeleteBtn" class="btn btn-danger" onclick="ConsumedModal.deleteRecord()">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── To Be Read modal ─────────────────────────────────────────────── -->
    <div id="tbrModal" class="modal">
      <div class="modal-content modal-content-wide">
        <h3 id="tbrModalTitle">Add</h3>
        <form id="tbrForm" onsubmit="QueuedModal.save(event)">
          <div class="form-group">
            <label for="tbrTitle">Title:</label>
            <input type="text" id="tbrTitle" required>
          </div>
          <div class="form-group">
            <label for="tbrOrder">Order:</label>
            <input type="number" id="tbrOrder" min="1" placeholder="Optional">
          </div>

          <div class="form-group-heading">Author</div>
          <div class="author-row">
            <input type="text" id="tbrAuthorGiven" placeholder="Given Name(s)">
            <input type="text" id="tbrAuthorSurname" placeholder="Surname">
          </div>

          <div class="form-group-heading">Author 2</div>
          <div class="author-row">
            <input type="text" id="tbrAuthor2Given" placeholder="Given Name(s)">
            <input type="text" id="tbrAuthor2Surname" placeholder="Surname">
          </div>

          <div class="form-group">
            <label for="tbrSource">Source:</label>
            <input type="text" id="tbrSource" placeholder="e.g. a friend, a podcast">
          </div>

          <div class="modal-actions">
            <div class="modal-actions-left">
              <button type="submit" class="btn btn-primary" id="tbrSaveBtn">Add to Reading List</button>
              <button type="button" class="btn btn-secondary" onclick="QueuedModal.close()">Cancel</button>
            </div>
            <button type="button" id="tbrDeleteBtn" class="btn btn-danger" onclick="QueuedModal.deleteRecord()">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── My Library modal ─────────────────────────────────────────────── -->
    <div id="mlModal" class="modal">
      <div class="modal-content modal-content-wide">
        <h3 id="mlModalTitle">Add</h3>
        <form id="mlForm" onsubmit="OwnedModal.save(event)">
          <div class="form-group">
            <label for="mlTitle">Title:</label>
            <input type="text" id="mlTitle" required>
          </div>

          <div class="form-group-heading">Author</div>
          <div class="author-row">
            <input type="text" id="mlAuthorGiven" placeholder="Given Name(s)">
            <input type="text" id="mlAuthorSurname" placeholder="Surname">
          </div>

          <div class="form-group-heading">Author 2</div>
          <div class="author-row">
            <input type="text" id="mlAuthor2Given" placeholder="Given Name(s)">
            <input type="text" id="mlAuthor2Surname" placeholder="Surname">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="mlPages">Pages:</label>
              <input type="number" id="mlPages" min="1">
            </div>
            <div class="form-group">
              <label for="mlISBN">ISBN:</label>
              <input type="text" id="mlISBN">
            </div>
          </div>

          <div class="form-group">
            <label for="mlLocation">Location:</label>
            <input type="text" id="mlLocation">
          </div>

          <div class="form-group">
            <label for="mlTagsInput">Tags:</label>
            <div class="tag-chip-container">
              <div class="tag-chip-field">
                <input type="text" id="mlTagsInput" placeholder="Type a tag and press Enter" autocomplete="off">
                <div class="tag-chip-suggestions" id="mlTagsSuggestions"></div>
              </div>
              <div class="tag-chip-row" id="mlTagsChipRow"></div>
              <input type="hidden" id="mlTags">
            </div>
          </div>

          <div class="modal-actions">
            <div class="modal-actions-left">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-secondary" onclick="OwnedModal.close()">Cancel</button>
            </div>
            <button type="button" id="mlDeleteBtn" class="btn btn-danger" onclick="OwnedModal.deleteRecord()">Delete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── Checkout modal (My Library C/O button) ───────────────────────── -->
    <div id="checkoutModal" class="modal">
      <div class="modal-content">
        <h3>Check Out Book</h3>
        <p id="checkoutBookTitle" style="margin-bottom: 16px; font-weight: 500;"></p>
        <form id="checkoutForm" onsubmit="OwnedView.confirmCheckout(event)">
          <div class="form-group">
            <label for="checkoutPatron">Patron:</label>
            <input type="text" id="checkoutPatron" required>
          </div>
          <div class="modal-actions">
            <div class="modal-actions-left">
              <button type="submit" class="btn btn-primary">Check Out</button>
              <button type="button" class="btn btn-secondary" onclick="OwnedView.closeCheckout()">Cancel</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/shared-utils.js"></script>
    <script src="js/date-utils.js"></script>
    <script src="js/rating-utils.js"></script>
    <script src="js/collection-view.js"></script>
    <script src="js/consumed-modal.js"></script>
    <script src="js/consumed-view.js"></script>
    <script src="js/queued-modal.js"></script>
    <script src="js/queued-view.js"></script>
    <script src="js/owned-modal.js"></script>
    <script src="js/owned-view.js"></script>
    <script src="js/tags.js"></script>

    <script>
        // ── Synthetic test data ──────────────────────────────────────────
        // ItemId links records across collections the way the real schema
        // does. o2/q3 deliberately share an ItemId with Source: 'My Library'
        // to exercise the To-Read-button-starts-hidden case on load.
        const testData = {
            consumed: [
                { id: 'c1', ItemId: 'item-dune', Title: 'Dune', Author: 'Herbert, Frank', Author2: '', Pages: 412, ISBN: '9780441013593', Tags: ['classic', 'scifi'], Finished: '2020-06-01', Rating: 5, Comments: 'Reread candidate.' },
                { id: 'c2', ItemId: 'item-omens', Title: 'Good Omens', Author: 'Gaiman, Neil', Author2: 'Pratchett, Terry', Pages: 412, ISBN: '', Tags: ['comedy', 'fantasy'], Finished: '2023-11-15', Rating: 4, Comments: '' },
                { id: 'c3', ItemId: 'item-draft', Title: 'Untitled Draft', Author: '', Author2: '', Pages: null, ISBN: '', Tags: [], Finished: '2024-01-01', Rating: null, Comments: '' }
            ],
            queued: [
                { id: 'q1', ItemId: 'item-piranesi', Title: 'Piranesi', Author: 'Clarke, Susanna', Tags: ['fantasy'], Rank: 1, Source: 'a friend' },
                { id: 'q2', ItemId: 'item-fifth-season', Title: 'The Fifth Season', Author: 'Jemisin, N.K.', Tags: ['scifi', 'fantasy'], Rank: 2, Source: 'a podcast' },
                { id: 'q3', ItemId: 'item-omens-owned', Title: 'Good Omens', Author: 'Gaiman, Neil', Tags: [], Rank: 3, Source: 'My Library' }
            ],
            owned: [
                { id: 'o1', ItemId: 'item-dune', Title: 'Dune', Author: 'Herbert, Frank', Tags: ['classic', 'scifi'], Location: 'Shelf A', Patron: '', CheckedOutDate: '' },
                { id: 'o2', ItemId: 'item-omens-owned', Title: 'Good Omens', Author: 'Gaiman, Neil', Tags: ['comedy'], Location: 'Shelf B', Patron: '', CheckedOutDate: '' },
                { id: 'o3', ItemId: 'item-hobbit', Title: 'The Hobbit', Author: 'Tolkien, J.R.R.', Tags: ['classic'], Location: 'Shelf A', Patron: 'Alex', CheckedOutDate: '2024-05-01' }
            ]
        };

        window.__testDateFormat = DateUtils.DEFAULT_FORMAT;

        CollectionView.render('panel-consumed', 'consumed', testData.consumed);
        CollectionView.render('panel-queued', 'queued', testData.queued);
        CollectionView.render('panel-owned', 'owned', testData.owned);

        function harnessShowPanel(panelId, tabEl) {
            document.querySelectorAll('.collection-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.harness-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            tabEl.classList.add('active');
        }

        function harnessChangeTheme(path) {
            document.getElementById('themeLink').href = path;
        }

        function harnessChangeDateFormat(format) {
            window.__testDateFormat = format;
            CollectionView.render('panel-consumed', 'consumed', CollectionView.getData('panel-consumed'));
            CollectionView.render('panel-queued', 'queued', CollectionView.getData('panel-queued'));
            CollectionView.render('panel-owned', 'owned', CollectionView.getData('panel-owned'));
        }
    </script>

  </body>
</html>
